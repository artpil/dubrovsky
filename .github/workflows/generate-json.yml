name: Generate images.json

on:
  push:
    branches: [main, master]
    paths:
      - "images/gallery/**"
      - "scripts/generate-images-json.js"
      - ".github/workflows/generate-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate images.json
        run: node ./scripts/generate-images-json.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- images/images.json; then
            echo "images.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/images.json
          git commit -m "chore: auto-update images.json [skip ci]"
          git push